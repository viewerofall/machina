# machina config — generated from your yazi setup
# ~/.config/machina/config.toml

[general]
show_hidden     = true
confirm_delete  = true
editor          = "/home/abyss/.local/bin/lvim"# from your yazi opener
icons = "nerd"
# Goto bookmarks — matches your yazi keymap `g <key>`
[bookmarks]
h = "~"
d = "~/Downloads"
D = "~/Documents"
c = "~/.config"
r = "/"

# Project shortcuts (yours from CLAUDE.md)
w = "~/woven"
v = "~/veil"
m = "~/machina"
y = "~/yourmom"
o = "~/overview"

# Extension -> command (mirrors yazi.toml [open] rules)
[openers]
